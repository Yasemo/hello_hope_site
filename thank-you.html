<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Thank you for registering with Hello Hope Canada."
    >
    <title>Thank You - Hello Hope Canada</title>

    <!-- Meta Pixel Code -->
    <script>
      !function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      }(
        window,
        document,
        "script",
        "https://connect.facebook.net/en_US/fbevents.js",
      );
      fbq("init", "1497149528035279");
      fbq("track", "PageView");
    </script>
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1497149528035279&ev=PageView&noscript=1"
      />
    </noscript>
    <!-- End Meta Pixel Code -->

    <style>
      :root {
        --bg: #f8f8f5;
        --text: #1b1b1b;
        --accent: #c91f1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Minion Pro", Georgia, serif;
      }

      .card {
        width: min(680px, 100%);
        background: #fff;
        border: 1px solid #ecece7;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.1;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0 0 12px;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .amount {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        margin-top: 8px;
        border-radius: 999px;
        background: #fff4f4;
        color: var(--accent);
        font-weight: 700;
        font-size: 1rem;
        min-height: 40px;
      }

      .actions {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #d8d8d8;
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Thank you for registering.</h1>
      <p>Your seat is confirmed. We are excited to have you with us.</p>
      <div class="amount" id="purchase-amount">Order total: CAD 0.00</div>
      <div class="actions">
        <a href="/conference" class="btn primary">Back to conference page</a>
        <a href="/" class="btn">Go to homepage</a>
      </div>
    </main>

    <script>
      function getCookieValue(name) {
        const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const match = document.cookie.match(
          new RegExp("(?:^|; )" + escapedName + "=([^;]*)"),
        );
        return match ? decodeURIComponent(match[1]) : null;
      }

      function normalizeCurrency(raw) {
        const value = (raw || "CAD").toUpperCase();
        return value.length === 3 ? value : "CAD";
      }

      function normalizeValue(raw) {
        const parsed = Number.parseFloat(raw || "0");
        return Number.isFinite(parsed) ? Number(parsed.toFixed(2)) : 0;
      }

      (function trackPurchase() {
        const params = new URLSearchParams(window.location.search);
        const value = normalizeValue(params.get("value"));
        const currency = normalizeCurrency(params.get("currency"));
        const eventId = params.get("event_id") ||
          ("luma_" + Date.now());
        const amountLabel = document.getElementById("purchase-amount");

        if (amountLabel) {
          amountLabel.textContent = "Order total: " + currency + " " +
            value.toFixed(2);
        }

        if (typeof fbq !== "undefined") {
          fbq("track", "Purchase", {
            value: value,
            currency: currency,
          }, {
            eventID: eventId,
          });
        }

        fetch("/api/meta/capi/purchase", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            event_id: eventId,
            value: value,
            currency: currency,
            source_url: window.location.href,
            fbp: getCookieValue("_fbp"),
            fbc: getCookieValue("_fbc"),
          }),
        }).catch(function (error) {
          console.error("Meta CAPI purchase forwarding failed:", error);
        });
      })();
    </script>
  </body>
</html>
